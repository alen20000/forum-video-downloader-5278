#chrome parameter 
chrome:
  #單位為秒
  pre-waiting-time: 10
  #單位為毫秒
  wait_for_timeout: 5000


block_setting:
  blocked_types: 
    - image
    - font
    - media
    - stylesheet
  ad_domains: 
    - google-analytics.com
    - doubleclick.net
    - adsystem.com
  
downloader_setting:
  #設定線程數，太慢或被鎖時可調整
  thread_count: 8

  download_mode: "--auto-select"
  retry-count: 10
